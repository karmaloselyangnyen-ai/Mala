<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mala</title>
<style>
:root{--bg:#f6efe2;--fg:#3b1d12;--mut:#8a6a55;--line:#c9b49a;--acc:#a8321f;--gold:#b8861b;--btn:#3b1d12;--btnfg:#f6efe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f0b;--fg:#f3e3c7;--mut:#b99a80;--line:#5a3a2c;--acc:#e0653f;--gold:#e0a53a;--btn:#f3e3c7;--btnfg:#1d0f0b}}
:root[data-theme="dark"]{--bg:#1d0f0b;--fg:#f3e3c7;--mut:#b99a80;--line:#5a3a2c;--acc:#e0653f;--gold:#e0a53a;--btn:#f3e3c7;--btnfg:#1d0f0b}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;-webkit-tap-highlight-color:transparent}
body{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 12px 28px;gap:10px}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{margin:4px 0 0;font-size:15px;letter-spacing:.18em;text-transform:uppercase;font-weight:normal;color:var(--mut)}
.tib{font-family:"Noto Serif Tibetan","Jomolhari","Kailasa","Songti SC",serif;font-size:28px;color:var(--gold);line-height:1.3}
#view{width:100%;aspect-ratio:1/.55;display:block;touch-action:manipulation;cursor:pointer}
.mid{display:flex;align-items:center;gap:18px;justify-content:center}
.ringbox{position:relative;width:128px;height:128px}
#mini{width:128px;height:128px;display:block}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#cur{font-size:34px;line-height:1}
#of{font-size:12px;color:var(--mut)}
.side{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-direction:column;gap:5px}
.lab{font-size:11px;color:var(--mut);letter-spacing:.06em}
.dots{display:flex;gap:4px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box;transition:background .25s,border-color .25s}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.tot{font-size:13px;color:var(--mut)}
.tot b{color:var(--fg);font-weight:normal;font-size:16px}
#heard{min-height:18px;font-size:13px;color:var(--mut);text-align:center;font-style:italic;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{min-height:34px;font-size:13px;text-align:center;color:var(--fg)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:15px;border:1.5px solid var(--btn);background:transparent;color:var(--btn);border-radius:999px;padding:10px 18px;cursor:pointer}
button.main{background:var(--btn);color:var(--btnfg);padding:12px 26px}
button.live{background:var(--acc);border-color:var(--acc);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(224,101,63,.18)}}
.small{font-size:12px;color:var(--mut);text-align:center;max-width:380px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mala</h1>
  <div class="tib">ཨོཾ་མ་ཎི་པད་མེ་ཧཱུྃ།</div>
  <canvas id="view" aria-label="Prayer beads. Tap to move one bead."></canvas>
  <div class="mid">
    <div class="ringbox">
      <canvas id="mini"></canvas>
      <div class="ctr"><div id="cur">0</div><div id="of">of 108</div></div>
    </div>
    <div class="side">
      <div class="row"><div class="lab">ROUNDS × 108</div><div class="dots" id="d1"></div></div>
      <div class="row"><div class="lab">TENS × 1080</div><div class="dots" id="d2"></div></div>
      <div class="tot">Total <b id="tot">0</b></div>
    </div>
  </div>
  <div id="heard"></div>
  <div id="status">Press Listen, then recite. One bead turns for each Om Mani Padme Hum.</div>
  <div class="btns">
    <button class="main" id="listen">Listen</button>
    <button id="undo">Undo</button>
    <button id="reset">Reset</button>
  </div>
  <div class="small">Speech recognition is imperfect with fast chanting. You can always tap the beads or press Space to move one bead by hand.</div>
</div>
<script>
(function(){
const N=108, STEP=2*Math.PI/N;
const $=id=>document.getElementById(id);
const view=$('view'), mini=$('mini'), vc=view.getContext('2d'), mc=mini.getContext('2d');
let total=0;
try{total=parseInt(localStorage.getItem('mala.total'),10)||0}catch(e){}
let pos=total, target=total;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// counter dots
['d1','d2'].forEach(id=>{const el=$(id);for(let i=0;i<10;i++)el.appendChild(document.createElement('i'))});

// audio
let AC=null;
function ctx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC}
function tone(f,dur,vol,type){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function tick(){tone(760,0.07,0.07,'triangle');try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function bell(){tone(523,1.8,0.12);tone(1046,1.4,0.06);tone(1568,1.0,0.03)}

// state changes
function save(){try{localStorage.setItem('mala.total',String(total))}catch(e){}}
function inc(){
  total++;target=total;save();update();tick();
  if(total%N===0){bell();say('A full round of 108 is complete.')}
}
function add(n){for(let k=0;k<n;k++)setTimeout(inc,k*190)}
function update(){
  const inRound=total%N, rounds=Math.floor(total/N);
  $('cur').textContent=(total>0&&inRound===0)?N:inRound;
  $('tot').textContent=total.toLocaleString();
  const u=rounds%10, t=Math.floor(rounds/10)%10;
  [...$('d1').children].forEach((d,i)=>d.classList.toggle('on',i<u));
  [...$('d2').children].forEach((d,i)=>d.classList.toggle('on',i<t));
  drawMini();
}
function say(s){$('status').textContent=s}

// bead drawing
function bead(c,x,y,r,base,lt,dk,dx){
  const g=c.createRadialGradient(x-r*.38+dx,y-r*.4,r*.1,x,y,r*1.05);
  g.addColorStop(0,lt);g.addColorStop(.55,base);g.addColorStop(1,dk);
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.28)';c.beginPath();c.ellipse(x-r*.35+dx,y-r*.42,r*.22,r*.12,-.6,0,7);c.fill();
}
function sizeCanvas(c,w,h){const d=window.devicePixelRatio||1;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}c.getContext('2d').setTransform(d,0,0,d,0,0)}

function draw(){
  const W=view.clientWidth,H=view.clientHeight;
  sizeCanvas(view,W,H);
  vc.clearRect(0,0,W,H);
  const s=W/7.2, R=s/STEP, cx=W/2, cy=H*0.5+R;
  const top=total%N;
  // string
  vc.strokeStyle=css('--mut');vc.globalAlpha=.7;vc.lineWidth=1.6;
  vc.beginPath();vc.arc(cx,cy,R,-Math.PI/2-0.6,-Math.PI/2+0.6);vc.stroke();vc.globalAlpha=1;
  const list=[];
  const base=Math.floor(pos);
  for(let k=-7;k<=8;k++){
    const abs=base+k, d=abs-pos, i=((abs%N)+N)%N;
    if(Math.abs(d)>6.3)continue;
    list.push({i,d,abs,sc:1+0.3*Math.exp(-d*d/5)});
  }
  list.sort((a,b)=>a.sc-b.sc);
  const cur=total%N;
  for(const b of list){
    const a=-Math.PI/2+b.d*STEP;
    const x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    const guru=b.i===0;
    const r=s*(guru?0.54:0.45)*b.sc*(guru?1.0:1);
    const counted=(b.abs<=total&&b.abs>total-cur)&&!guru;
    const col=guru?['#7a1d14','#b84a35','#3d0b07']:counted?['#a85a30','#d78b57','#5e2c14']:['#6b3a22','#a56a45','#2f160a'];
    if(guru){ // tassel
      vc.strokeStyle='#b8861b';vc.lineWidth=2;
      for(let t=-2;t<=2;t++){vc.beginPath();vc.moveTo(x+t*1.5,y+r*.8);vc.lineTo(x+t*4,y+r*.8+s*1.1);vc.stroke()}
      vc.fillStyle='#b8861b';vc.fillRect(x-4,y+r*.75,8,5);
    }
    bead(vc,x,y,r,col[0],col[1],col[2],-b.d*r*.1);
    if(guru){vc.strokeStyle='#d9a93a';vc.lineWidth=1.5;vc.beginPath();vc.arc(x,y,r*.98,0,7);vc.stroke()}
  }
  // reading window
  const wy=cy-R;
  vc.strokeStyle=css('--gold');vc.lineWidth=2;vc.globalAlpha=.85;
  vc.beginPath();vc.arc(cx,wy,s*0.66,0,7);vc.stroke();vc.globalAlpha=1;
  vc.fillStyle=css('--gold');vc.beginPath();vc.moveTo(cx-6,wy-s*0.66-11);vc.lineTo(cx+6,wy-s*0.66-11);vc.lineTo(cx,wy-s*0.66-2);vc.fill();
}
function drawMini(){
  const S=128;sizeCanvas(mini,S,S);mc.clearRect(0,0,S,S);
  const R=S/2-7, c=S/2, cur=total%N, full=total>0&&cur===0;
  for(let i=0;i<N;i++){
    const a=-Math.PI/2+i*STEP;
    const on=full||(i>0&&i<=cur)||(i===0&&total>0);
    mc.fillStyle=i===0?css('--acc'):on?css('--gold'):css('--line');
    mc.beginPath();mc.arc(c+R*Math.cos(a),c+R*Math.sin(a),i===0?3.6:on?2.4:1.9,0,7);mc.fill();
  }
}
function loop(){
  const d=target-pos;
  if(Math.abs(d)>0.0005){pos+=d*0.2;if(Math.abs(target-pos)<0.0005)pos=target}
  draw();requestAnimationFrame(loop);
}

// speech
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const RX=/\b(?:pad+|pat+|bad+|bed+|pet+|bud+|pud+|per|par|pam|pem|pema|pe+d?|pay|bay|pen)\s?m[aeiy]{1,2}n?\b/gi;
let rec=null, listening=false, counted=0;
function spawn(){
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';counted=0;
  rec.onresult=e=>{
    let t='';
    for(let i=0;i<e.results.length;i++)t+=' '+e.results[i][0].transcript;
    $('heard').textContent=t.trim().slice(-48);
    const n=(t.match(RX)||[]).length;
    if(n>counted){const d=n-counted;counted=n;add(d)}
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      stop();say('Microphone access was blocked. Allow it in your browser settings, or tap the beads to count by hand.');
    }else if(e.error==='network'){
      stop();say('Speech recognition needs an internet connection. You can still tap to count.');
    }else if(e.error==='audio-capture'){
      stop();say('No microphone was found or it is in use by another app.');
    }else if(e.error!=='no-speech'&&e.error!=='aborted'){
      say('Speech recognition error: '+e.error);
    }
  };
  rec.onstart=()=>{say('Microphone is on. Recite now, and you should see your words appear below.')};
  rec.onend=()=>{if(listening)setTimeout(()=>{if(listening)spawn()},150)};
  try{rec.start()}catch(e){}
}
function start(){
  ctx();
  if(!SR){say('This browser has no speech recognition. Try Chrome or Safari, or tap the beads to count.');return}
  listening=true;$('listen').textContent='Stop';$('listen').classList.add('live');
  say('Listening. Recite Om Mani Padme Hum.');spawn();
}
function stop(){
  listening=false;$('listen').textContent='Listen';$('listen').classList.remove('live');
  try{rec&&rec.stop()}catch(e){}
  $('heard').textContent='';
}
$('listen').onclick=()=>listening?(stop(),say('Paused.')):start();

// manual + controls
view.addEventListener('click',()=>{ctx();inc()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();inc()}});
$('undo').onclick=()=>{if(total>0){total--;target=total;save();update()}};
let armed=false,tm=null;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='Tap again to reset';tm=setTimeout(()=>{armed=false;$('reset').textContent='Reset'},2500);return}
  clearTimeout(tm);armed=false;$('reset').textContent='Reset';
  total=0;target=0;pos=0;save();update();say('Counter reset.');
};

update();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
